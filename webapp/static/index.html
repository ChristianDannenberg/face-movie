<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face-Movie</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--fg:#f8fafc;--muted:#94a3b8;--line:#334155;--accent:#fb923c;--err:#f87171}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--fg);padding:32px 18px}.wrap{max-width:900px;margin:auto}h1{text-align:center;margin:0}.tag{text-align:center;color:var(--muted)}.drop{margin-top:28px;border:2px dashed var(--line);background:var(--panel);border-radius:12px;padding:40px;text-align:center;cursor:pointer}.drop:hover{border-color:var(--accent)}a{color:var(--accent)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.control{display:flex;flex-direction:column;gap:5px}.control label{color:var(--muted);font-size:12px}.control input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}.checks{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:var(--accent);font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.faces{margin:24px 0}.faces h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.card.excluded{opacity:.55;border-style:dashed}.card.excluded .photo{filter:grayscale(.8)}.name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.photo{position:relative;line-height:0}.photo img{width:100%;height:auto;border-radius:7px}.face{position:absolute;border:3px solid #fff;background:transparent;cursor:pointer;border-radius:8px;min-width:16px;min-height:16px}.face.selected{border-color:var(--accent);box-shadow:0 0 0 2px #0008}.badge{position:absolute;top:-18px;left:-3px;background:#111;color:#fff;font-size:11px;line-height:16px;padding:0 4px;border-radius:3px}.warn{color:#fbbf24;font-size:12px;margin-top:6px}.include-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.include-row input{width:18px;height:18px}.cropbtn{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);cursor:pointer}.cropbox{position:absolute;border:2px dashed var(--accent);background:#fb923c22;pointer-events:none}.cropping{cursor:crosshair;touch-action:none}.status,.error,.result{margin-top:18px;padding:14px;background:var(--panel);border-radius:9px}.error{color:var(--err)}video{width:100%}[hidden]{display:none!important}@media(max-width:650px){.controls{grid-template-columns:1fr}.checks{grid-column:1}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>Face-Movie</h1><p class="tag">Bilder auswählen → Gesichter prüfen → Film rendern</p>
<div class="drop" id="drop"><strong>Fotos oder Ordner hier ablegen</strong><div>oder <a href="#" id="pickFiles">Dateien wählen</a> · <a href="#" id="pickFolder">Ordner wählen</a></div><div id="picked"></div></div>
<input id="files" type="file" multiple accept="image/jpeg,image/png" hidden><input id="folder" type="file" webkitdirectory hidden>
<div class="controls"><div class="control"><label>Scale</label><input id="scale" type="number" value="1" min=".1" max="1" step=".1"></div><div class="control"><label>Frames pro Übergang</label><input id="fpp" type="number" value="30" min="1" max="60"></div><div class="control"><label>FPS</label><input id="fps" type="number" value="30" min="10" max="60"></div><div class="control"><label>Pause zwischen Morphings (Sekunden)</label><input id="hold" type="number" value="0" min="0" max="60" step="0.1" title="0 = keine Pause; 1 = eine Sekunde Standbild"></div><div class="checks"><label><input id="overlay" type="checkbox" checked> Dateiname einblenden</label><label><input id="front" type="checkbox"> Nur frontale Gesichter</label></div></div>
<button class="btn" id="analyze" disabled>1. Gesichter analysieren</button><section class="faces" id="faces" hidden><h2>2. Gesicht pro Bild auswählen</h2><p class="tag" style="text-align:left">Orange = ausgewählt. Bei mehreren Personen einfach auf den richtigen Rahmen klicken.</p><div class="grid" id="grid"></div><button class="btn" id="render">3. Film rendern</button></section>
<div class="status" id="status" hidden></div><div class="error" id="error" hidden></div><div class="result" id="result" hidden><video id="video" controls autoplay loop></video><p><a id="download">MP4 herunterladen</a></p></div></div>
<script>
const $=id=>document.getElementById(id), IMG=/\.(jpe?g|png)$/i; let selected=[],job=null,choices={},manualCrops={},included={};
function setFiles(a){selected=a.filter(f=>IMG.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));$('picked').textContent=selected.length?`${selected.length} Bilder ausgewählt`:'';$('analyze').disabled=selected.length<2;$('faces').hidden=true;job=null;choices={};manualCrops={};included={}}
$('pickFiles').onclick=e=>{e.preventDefault();$('files').click()};$('pickFolder').onclick=e=>{e.preventDefault();$('folder').click()};$('files').onchange=()=>setFiles([...$('files').files]);$('folder').onchange=()=>setFiles([...$('folder').files]);$('drop').onclick=e=>{if(e.target.tagName!=='A')$('files').click()};$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();setFiles([...e.dataTransfer.files])};
function fail(m){$('error').textContent=m;$('error').hidden=false;$('status').hidden=true}
$('analyze').onclick=async()=>{ $('error').hidden=true;$('result').hidden=true;$('status').hidden=false;$('status').textContent='Bilder werden hochgeladen und Gesichter analysiert…';$('analyze').disabled=true;const fd=new FormData();selected.forEach(f=>fd.append('files',f,f.name));try{const r=await fetch('/api/analyze',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());const d=await r.json();job=d.job_id;renderFaces(d.items);$('status').hidden=true;$('faces').hidden=false}catch(e){fail(e.message)}finally{$('analyze').disabled=false}}
function addFaceButtons(p,filename,faces){p.querySelectorAll('.face').forEach(x=>x.remove());if(!faces.length)return;choices[filename]=0;faces.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='face'+(f.index===0?' selected':'');b.style.left=(f.x*100)+'%';b.style.top=(f.y*100)+'%';b.style.width=(f.w*100)+'%';b.style.height=(f.h*100)+'%';b.title=`Gesicht ${f.index+1} auswählen`;const badge=document.createElement('span');badge.className='badge';badge.textContent=f.index+1;b.appendChild(badge);b.onclick=()=>{choices[filename]=f.index;p.querySelectorAll('.face').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};p.appendChild(b)})}
function enableCrop(btn,p,filename,warn){btn.textContent='Rahmen um Gesicht ziehen…';btn.disabled=true;p.classList.add('cropping');let start=null,box=null;const point=e=>{const r=p.getBoundingClientRect();return{x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top)),rw:r.width,rh:r.height}};const down=e=>{if(e.button!==0)return;e.preventDefault();start=point(e);box=document.createElement('div');box.className='cropbox';p.appendChild(box);p.setPointerCapture(e.pointerId)};const move=e=>{if(!start||!box)return;const q=point(e),x=Math.min(start.x,q.x),y=Math.min(start.y,q.y),ww=Math.abs(q.x-start.x),hh=Math.abs(q.y-start.y);Object.assign(box.style,{left:x+'px',top:y+'px',width:ww+'px',height:hh+'px'})};const up=async e=>{if(!start)return;const q=point(e),x=Math.min(start.x,q.x),y=Math.min(start.y,q.y),ww=Math.abs(q.x-start.x),hh=Math.abs(q.y-start.y);start=null;p.classList.remove('cropping');p.removeEventListener('pointerdown',down);p.removeEventListener('pointermove',move);p.removeEventListener('pointerup',up);if(ww<20||hh<20){if(box)box.remove();btn.disabled=false;btn.textContent='Bereich wählen';warn.textContent='Bereich zu klein – bitte Kopf/Gesicht großzügig einrahmen';return}warn.textContent='Gewählten Bereich analysieren…';try{const r=await fetch(`/api/crop/${job}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename,x:x/q.rw,y:y/q.rh,w:ww/q.rw,h:hh/q.rh})});if(!r.ok)throw new Error(await r.text());const d=await r.json();if(d.faces.length){manualCrops[filename]=[x/q.rw,y/q.rh,ww/q.rw,hh/q.rh];addFaceButtons(p,filename,d.faces);included[filename]=true;const card=p.closest('.card'),use=card.querySelector('.include-row input');if(use){use.checked=true;card.classList.remove('excluded')}warn.textContent='Gesicht im manuellen Bereich erkannt';btn.hidden=true}else{warn.textContent='Auch im gewählten Bereich kein Gesicht erkannt';btn.disabled=false;btn.textContent='Anderen Bereich wählen'}}catch(err){warn.textContent=err.message;btn.disabled=false;btn.textContent='Erneut versuchen'}finally{if(box)box.remove()}};p.addEventListener('pointerdown',down);p.addEventListener('pointermove',move);p.addEventListener('pointerup',up)}
function renderFaces(items){const g=$('grid');g.innerHTML='';choices={};manualCrops={};included={};for(const it of items){const c=document.createElement('div');c.className='card';const n=document.createElement('div');n.className='name';n.textContent=it.filename;c.appendChild(n);included[it.filename]=it.faces.length>0;const row=document.createElement('label');row.className='include-row';const use=document.createElement('input');use.type='checkbox';use.checked=included[it.filename];const txt=document.createElement('span');txt.textContent='Im Video verwenden';row.append(use,txt);c.appendChild(row);use.onchange=()=>{included[it.filename]=use.checked;c.classList.toggle('excluded',!use.checked)};if(!use.checked)c.classList.add('excluded');const p=document.createElement('div');p.className='photo';const im=document.createElement('img');im.src=it.preview;im.alt=it.filename;p.appendChild(im);c.appendChild(p);if(it.faces.length){addFaceButtons(p,it.filename,it.faces)}else{const w=document.createElement('div');w.className='warn';w.textContent='Kein Gesicht erkannt – manuellen Bereich versuchen';c.appendChild(w);const b=document.createElement('button');b.type='button';b.className='cropbtn';b.textContent='Bereich wählen';b.onclick=()=>enableCrop(b,p,it.filename,w);c.appendChild(b)}g.appendChild(c)}}
$('render').onclick=async()=>{if(!job)return; $('error').hidden=true;$('result').hidden=true;$('status').hidden=false;$('status').textContent='Render wird gestartet…';$('render').disabled=true;const excluded=Object.entries(included).filter(([,use])=>!use).map(([name])=>name);const count=selected.length-excluded.length;if(count<2){fail('Mindestens zwei Bilder müssen für das Video aktiviert sein.');$('render').disabled=false;return}const body={scale:+$('scale').value,frames_per_pair:+$('fpp').value,fps:+$('fps').value,hold_seconds:+$('hold').value,overlay:$('overlay').checked,front_facing_only:$('front').checked,selections:choices,manual_crops:manualCrops,excluded_files:excluded};try{const r=await fetch(`/api/render/${job}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());follow(job)}catch(e){fail(e.message);$('render').disabled=false}}
function follow(id){const es=new EventSource(`/api/events/${id}`);es.onmessage=e=>{const d=JSON.parse(e.data);if(d.error){es.close();fail(d.error);$('render').disabled=false;return}$('status').textContent=d.total?`${d.stage}: ${d.current}/${d.total}`:d.stage;if(d.stage==='done'){es.close();$('status').hidden=true;$('video').src=`/api/download/${id}?t=${Date.now()}`;$('download').href=`/api/download/${id}`;$('result').hidden=false;$('render').disabled=false}};es.onerror=()=>{es.close();fail('Verbindung zum Server verloren');$('render').disabled=false}}
</script></body></html>
